[project]
name = "interview-eval-platform"
version = "1.0.0"
description = "AI-driven interview response evaluation platform (backend + API)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]
