name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Create schema
        run: python -m scripts.init_db
      - name: Test
        run: pytest -q
      - name: Seed and check verdict routing
        run: |
          python -m scripts.seed --reset | tee seed.log
          grep -q "routed=correct" seed.log
          grep -q "routed=incorrect" seed.log
          grep -q "routed=requires_human_review" seed.log
